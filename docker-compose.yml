# Local development database only — never use these credentials in production.
# Port 5433 on the host (not 5432) so it doesn't clash with a Postgres you
# may already have installed locally.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club
    ports:
      - "5433:5432"
    volumes:
      - club_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  club_pgdata:
